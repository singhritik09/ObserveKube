{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="text-center">
    <h1 class="display-5">Cluster Dashboard</h1>

    <a href="/status/" class="btn btn-success">
        Check Status
    </a>
<form method="get" action="{% url 'status' %}">
    <select name="namespace" class="form-select">
        {% for ns in namespaces %}
            <option value="{{ ns }}">{{ ns }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary mt-2">
        Check Pods
    </button>
</form>
</div>
{% endblock %}
